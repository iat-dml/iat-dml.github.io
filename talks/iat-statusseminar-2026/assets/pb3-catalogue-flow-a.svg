<?xml version="1.0" encoding="utf-8"?>
<!--
  PB3 Data Catalogue — how a dataset record travels.
  Option A: the chain. Four beats across the top, one trunk down to the
  two surfaces the record ends up on. Deliberately the same skeleton as
  iat-project-tracker-flow.svg so the deck's two process figures read as
  one hand.

  Standalone and self-contained: styles inlined against the DML brand
  tokens (presentations/iat-statusseminar-2026/css/brand.css) with hard
  fallbacks, so it renders identically inside the deck and on its own in
  the PB3-data-catalogue README. Authored in 960x600 user units, the 16:10
  of .project-media.

  Drawn in the SUPPORT stratum green (the brand-support token) because that is the
  band this project sits in; the tracker figure's tan is Integration.

  SVG <text> does not wrap. Retitle a node and you re-measure it by hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" class="flow-pb3"
     viewBox="0 0 960 600" width="960" height="600" role="img"
     aria-label="Researchers describe a dataset in Markdown and YAML; the record is pushed to GitHub, validated by automated Python checks and signed off by a Data Steward, after which it is published both as a static-site data catalogue and as an Obsidian knowledge graph linked on its keywords.">
  <style>
    .flow-pb3 { font-family: var(--font-body, "DM Sans", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif); }

    /* Cards and panels: the deck's own paper-on-paper language, lifted
       verbatim from .flow-tracker so the two diagrams read as one hand. */
    .flow-pb3 .pb-card     { fill: var(--brand-white, #FFFFFF); stroke: rgba(70, 85, 85, 0.14); stroke-width: 1; }
    .flow-pb3 .pb-card-hub { fill: var(--brand-white, #FFFFFF); stroke: rgba(45, 106, 79, 0.55); stroke-width: 1.5; }
    .flow-pb3 .pb-band     { fill: rgba(70, 85, 85, 0.045); }
    .flow-pb3 .pb-band-alt { fill: rgba(45, 106, 79, 0.055); }

    /* The PB3 catalogue is a SUPPORT-stratum project, so the flow is drawn
       in the support green, not the integration tan the tracker uses. */
    .flow-pb3 .pb-flow       { fill: none; stroke: var(--brand-support, #2D6A4F); stroke-width: 2.2; stroke-linecap: round; }
    .flow-pb3 .pb-arrow-head { fill: var(--brand-support, #2D6A4F); }

    .flow-pb3 .pb-title     { font-size: 22px; font-weight: 500; fill: var(--brand-slate, #465555); }
    .flow-pb3 .pb-title-hub { font-size: 22px; font-weight: 700; fill: var(--brand-support-ink, #2D6A4F); }
    .flow-pb3 .pb-out-title { font-size: 24px; font-weight: 700; fill: var(--brand-slate, #465555); }
    .flow-pb3 .pb-sub       { font-size: 15px; fill: var(--brand-muted, #7A817E); }
    .flow-pb3 .pb-lane      { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; fill: var(--brand-muted, #7A817E); }
    .flow-pb3 .pb-step      { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; fill: var(--brand-support-ink, #2D6A4F); }
    .flow-pb3 .pb-rule      { fill: rgba(70, 85, 85, 0.14); }

    /* Icons are drawn, not glyphs: one 24px stroke grid throughout, so they
       scale with the slide and recolour with the tokens. */
    .flow-pb3 .pb-ico     { fill: none; stroke: var(--brand-slate, #465555);   stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .flow-pb3 .pb-ico-hub { fill: none; stroke: var(--brand-support, #2D6A4F); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    /* The two real marks are fill-based and stay monochrome: full-colour
       vendor logos would fight the deck's three-colour stratum scheme. */
    .flow-pb3 .pb-logo     { fill: var(--brand-slate, #465555); stroke: none; }
    .flow-pb3 .pb-logo-hub { fill: var(--brand-support, #2D6A4F); stroke: none; }

    /* Content stand-ins inside the payoff panels. */
    .flow-pb3 .pb-bar      { fill: rgba(70, 85, 85, 0.20); }
    .flow-pb3 .pb-bar-soft { fill: rgba(70, 85, 85, 0.11); }
    .flow-pb3 .pb-chip     { fill: rgba(45, 106, 79, 0.12); }
    .flow-pb3 .pb-node     { fill: var(--brand-support, #2D6A4F); }
    .flow-pb3 .pb-node-key { fill: var(--brand-white, #FFFFFF); stroke: var(--brand-support, #2D6A4F); stroke-width: 1.6; }
    .flow-pb3 .pb-edge     { fill: none; stroke: rgba(45, 106, 79, 0.38); stroke-width: 1.4; }

    .flow-pb3 .pb-out-sm   { font-size: 18px; font-weight: 700; fill: var(--brand-slate, #465555); }
    .flow-pb3 .pb-sub-sm   { font-size: 14px; fill: var(--brand-muted, #7A817E); }
    .flow-pb3 .pb-badge    { fill: var(--brand-white, #FFFFFF); stroke: var(--brand-support, #2D6A4F); stroke-width: 1.6; }
    .flow-pb3 .pb-badge-tick { fill: none; stroke: var(--brand-support, #2D6A4F); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .flow-pb3 .pb-legend   { font-size: 13px; fill: var(--brand-muted, #7A817E); }
    .flow-pb3 .pb-node-sm  { font-size: 20px; font-weight: 700; fill: var(--brand-slate, #465555); }

    .flow-pb3 .pb-mono     { font-family: var(--font-mono, "Segoe UI Mono", "Cascadia Mono", Consolas, monospace); font-size: 15px; fill: var(--brand-slate, #465555); }
    .flow-pb3 .pb-mono-key { font-family: var(--font-mono, "Segoe UI Mono", "Cascadia Mono", Consolas, monospace); font-size: 15px; fill: var(--brand-support-ink, #2D6A4F); font-weight: 700; }
    .flow-pb3 .pb-mono-dim { font-family: var(--font-mono, "Segoe UI Mono", "Cascadia Mono", Consolas, monospace); font-size: 15px; fill: var(--brand-muted, #7A817E); }
  </style>

  <defs>
    <linearGradient id="pb-paper" x1="0" y1="0" x2="0.62" y2="1">
      <stop offset="0"    stop-color="#FBFAF7"/>
      <stop offset="0.58" stop-color="#F5F3EE"/>
      <stop offset="1"    stop-color="#EBE6DC"/>
    </linearGradient>
    <marker id="pb-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path class="pb-arrow-head" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
    <filter id="pb-lift" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1A1A1A" flood-opacity="0.07"/>
    </filter>
    <filter id="pb-lift-hub" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2D6A4F" flood-opacity="0.16"/>
    </filter>

    <!-- A dataset record: a file whose first block is YAML front matter. -->
    <symbol id="ic-record" viewBox="0 0 24 24">
      <path d="M5.25 2.75h8.5l5 5v13.5a1 1 0 0 1-1 1H5.25a1 1 0 0 1-1-1V3.75a1 1 0 0 1 1-1z"/>
      <path d="M13.5 2.9V8h4.6"/>
      <path d="M7.25 11.5h4.5M7.25 14.5h9.5M7.25 17.5h6.5"/>
    </symbol>

    <!-- GitHub. Octocat mark, 256-unit grid, from assets/icons/github-logo.svg. -->
    <symbol id="ic-github" viewBox="0 0 256 256">
      <path d="M208.31,75.68A59.78,59.78,0,0,0,202.93,28,8,8,0,0,0,196,24a59.75,59.75,0,0,0-48,24H124A59.75,59.75,0,0,0,76,24a8,8,0,0,0-6.93,4,59.78,59.78,0,0,0-5.38,47.68A58.14,58.14,0,0,0,56,104v8a56.06,56.06,0,0,0,48.44,55.47A39.8,39.8,0,0,0,96,192v8H72a24,24,0,0,1-24-24A40,40,0,0,0,8,136a8,8,0,0,0,0,16,24,24,0,0,1,24,24,40,40,0,0,0,40,40H96v16a8,8,0,0,0,16,0V192a24,24,0,0,1,48,0v40a8,8,0,0,0,16,0V192a39.8,39.8,0,0,0-8.44-24.53A56.06,56.06,0,0,0,216,112v-8A58.14,58.14,0,0,0,208.31,75.68ZM200,112a40,40,0,0,1-40,40H112a40,40,0,0,1-40-40v-8a41.74,41.74,0,0,1,6.9-22.48A8,8,0,0,0,80,73.83a43.81,43.81,0,0,1,.79-33.58,43.88,43.88,0,0,1,32.32,20.06A8,8,0,0,0,119.82,64h32.35a8,8,0,0,0,6.74-3.69,43.87,43.87,0,0,1,32.32-20.06A43.81,43.81,0,0,1,192,73.83a8.09,8.09,0,0,0,1,7.65A41.72,41.72,0,0,1,200,104Z"/>
    </symbol>

    <!-- Obsidian. Mark from presentations/.../assets/obsidian-logo.svg. -->
    <symbol id="ic-obsidian" viewBox="0 0 24 24">
      <path d="M19.355 18.538a68.967 68.959 0 0 0 1.858 -2.954 0.81 0.81 0 0 0 -0.062 -0.9c-0.516 -0.685 -1.504 -2.075 -2.042 -3.362 -0.553 -1.321 -0.636 -3.375 -0.64 -4.377a1.707 1.707 0 0 0 -0.358 -1.05l-3.198 -4.064a3.744 3.744 0 0 1 -0.076 0.543c-0.106 0.503 -0.307 1.004 -0.536 1.5 -0.134 0.29 -0.29 0.6 -0.446 0.914l-0.31 0.626c-0.516 1.068 -0.997 2.227 -1.132 3.59 -0.124 1.26 0.046 2.73 0.815 4.481 0.128 0.011 0.257 0.025 0.386 0.044a6.363 6.363 0 0 1 3.326 1.505c0.916 0.79 1.744 1.922 2.415 3.5zM8.199 22.569c0.073 0.012 0.146 0.02 0.22 0.02 0.78 0.024 2.095 0.092 3.16 0.29 0.87 0.16 2.593 0.64 4.01 1.055 1.083 0.316 2.198 -0.548 2.355 -1.664 0.114 -0.814 0.33 -1.735 0.725 -2.58l-0.01 0.005c-0.67 -1.87 -1.522 -3.078 -2.416 -3.849a5.295 5.295 0 0 0 -2.778 -1.257c-1.54 -0.216 -2.952 0.19 -3.84 0.45 0.532 2.218 0.368 4.829 -1.425 7.531zM5.533 9.938c-0.023 0.1 -0.056 0.197 -0.098 0.29L2.82 16.059a1.602 1.602 0 0 0 0.313 1.772l4.116 4.24c2.103 -3.101 1.796 -6.02 0.836 -8.3 -0.728 -1.73 -1.832 -3.081 -2.55 -3.831zM9.32 14.01c0.615 -0.183 1.606 -0.465 2.745 -0.534 -0.683 -1.725 -0.848 -3.233 -0.716 -4.577 0.154 -1.552 0.7 -2.847 1.235 -3.95 0.113 -0.235 0.223 -0.454 0.328 -0.664 0.149 -0.297 0.288 -0.577 0.419 -0.86 0.217 -0.47 0.379 -0.885 0.46 -1.27 0.08 -0.38 0.08 -0.72 -0.014 -1.043 -0.095 -0.325 -0.297 -0.675 -0.68 -1.06a1.6 1.6 0 0 0 -1.475 0.36l-4.95 4.452a1.602 1.602 0 0 0 -0.513 0.952l-0.427 2.83c0.672 0.59 2.328 2.316 3.335 4.711 0.09 0.21 0.175 0.43 0.253 0.653z"/>
    </symbol>

    <!-- Automated checks: a CI window that has gone green. -->
    <symbol id="ic-checks" viewBox="0 0 24 24">
      <rect x="2.75" y="4.25" width="18.5" height="15.5" rx="2.25"/>
      <path d="M2.75 8.5h18.5"/>
      <path d="M5.5 6.4h0.01M7.9 6.4h0.01M10.3 6.4h0.01"/>
      <path d="M7 14.2l2.6 2.6L17 9.4"/>
    </symbol>

    <!-- The Data Steward: a person carrying the approval. -->
    <symbol id="ic-steward" viewBox="0 0 24 24">
      <circle cx="9.25" cy="6.75" r="3.5"/>
      <path d="M2.9 20.75a6.35 6.35 0 0 1 11.4 -3.85"/>
      <circle cx="17.6" cy="17.4" r="4.35"/>
      <path d="M15.75 17.5l1.35 1.35 2.5 -2.7"/>
    </symbol>

    <!-- The catalogue: a browser window listing records. -->
    <symbol id="ic-catalogue" viewBox="0 0 24 24">
      <rect x="2.75" y="3.75" width="18.5" height="16.5" rx="2.25"/>
      <path d="M2.75 8h18.5"/>
      <path d="M6.4 11.6h4.6M6.4 15.6h4.6M14 11.6h3.6M14 15.6h3.6"/>
    </symbol>

  </defs>

  <rect width="960" height="600" fill="url(#pb-paper)"/>

  <!-- Chain across the top, then one trunk down to a bus that feeds both
       surfaces. Same skeleton as the IAT project tracker figure, so the two
       diagrams read as a pair. -->
  <g class="pb-flow">
    <path d="M 231 142 H 257" marker-end="url(#pb-arrow)"/>
    <path d="M 467 142 H 493" marker-end="url(#pb-arrow)"/>
    <path d="M 703 142 H 729" marker-end="url(#pb-arrow)"/>
    <path d="M 834 224 V 278 Q 834 290 822 290 H 266 Q 254 290 254 302 V 330"/>
    <path d="M 254 320 V 350" marker-end="url(#pb-arrow)"/>
    <path d="M 706 290 V 350" marker-end="url(#pb-arrow)"/>
  </g>

  <!-- 1. Describe -->
  <rect class="pb-card" x="26" y="64" width="200" height="156" rx="8" filter="url(#pb-lift)"/>
  <use class="pb-ico" href="#ic-record" x="106" y="88" width="40" height="40"/>
  <text class="pb-title" x="126" y="170" text-anchor="middle">Describe</text>
  <text class="pb-sub"   x="126" y="194" text-anchor="middle">Markdown + YAML</text>

  <!-- 2. Push -->
  <rect class="pb-card" x="262" y="64" width="200" height="156" rx="8" filter="url(#pb-lift)"/>
  <use class="pb-logo" href="#ic-github" x="342" y="88" width="40" height="40"/>
  <text class="pb-title" x="362" y="170" text-anchor="middle">Push</text>
  <text class="pb-sub"   x="362" y="194" text-anchor="middle">GitHub</text>

  <!-- 3. Validate -->
  <rect class="pb-card" x="498" y="64" width="200" height="156" rx="8" filter="url(#pb-lift)"/>
  <use class="pb-ico" href="#ic-checks" x="578" y="88" width="40" height="40"/>
  <text class="pb-title" x="598" y="170" text-anchor="middle">Validate</text>
  <text class="pb-sub"   x="598" y="194" text-anchor="middle">Python checks</text>

  <!-- 4. Sign off. The one human gate, so it is the node drawn in the
       Support stratum's colour rather than in slate. -->
  <rect class="pb-card-hub" x="734" y="64" width="200" height="156" rx="8" filter="url(#pb-lift-hub)"/>
  <use class="pb-ico-hub" href="#ic-steward" x="814" y="88" width="40" height="40"/>
  <text class="pb-title-hub" x="834" y="170" text-anchor="middle">Sign off</text>
  <text class="pb-sub"       x="834" y="194" text-anchor="middle">Data Steward</text>

  <!-- Payoff, left: the catalogue -->
  <rect class="pb-card" x="40" y="356" width="428" height="200" rx="8" filter="url(#pb-lift)"/>
  <use class="pb-ico" href="#ic-catalogue" x="68" y="386" width="34" height="34"/>
  <text class="pb-out-title" x="118" y="404">Data catalogue</text>
  <text class="pb-sub"       x="118" y="428">Static site, one page per dataset</text>
  <rect class="pb-rule" x="68" y="450" width="372" height="1"/>
  <g>
    <rect class="pb-bar"  x="68"  y="470" width="180" height="9" rx="4.5"/>
    <rect class="pb-chip" x="264" y="466" width="82" height="17" rx="8.5"/>
    <rect class="pb-chip" x="356" y="466" width="58" height="17" rx="8.5"/>
    <rect class="pb-bar"  x="68"  y="500" width="150" height="9" rx="4.5"/>
    <rect class="pb-chip" x="264" y="496" width="60" height="17" rx="8.5"/>
    <rect class="pb-chip" x="334" y="496" width="80" height="17" rx="8.5"/>
    <rect class="pb-bar"  x="68"  y="530" width="196" height="9" rx="4.5"/>
    <rect class="pb-chip" x="280" y="526" width="66" height="17" rx="8.5"/>
    <rect class="pb-chip" x="356" y="526" width="58" height="17" rx="8.5"/>
  </g>

  <!-- Payoff, right: the graph -->
  <rect class="pb-card" x="492" y="356" width="428" height="200" rx="8" filter="url(#pb-lift)"/>
  <use class="pb-logo" href="#ic-obsidian" x="520" y="386" width="34" height="34"/>
  <text class="pb-out-title" x="570" y="404">Knowledge graph</text>
  <text class="pb-sub"       x="570" y="428">Obsidian, linked on keywords</text>
  <rect class="pb-rule" x="520" y="450" width="372" height="1"/>
  <g class="pb-edge">
    <path d="M 578 476 L 534 524"/>
    <path d="M 578 476 L 642 512"/>
    <path d="M 578 476 L 758 472"/>
    <path d="M 700 534 L 642 512"/>
    <path d="M 700 534 L 758 472"/>
    <path d="M 700 534 L 880 528"/>
    <path d="M 826 478 L 758 472"/>
    <path d="M 826 478 L 880 528"/>
    <path d="M 826 478 L 642 512"/>
    <path d="M 534 524 L 642 512"/>
  </g>
  <g>
    <circle class="pb-node" cx="578" cy="476" r="9"/>
    <circle class="pb-node" cx="700" cy="534" r="9"/>
    <circle class="pb-node" cx="826" cy="478" r="9"/>
    <circle class="pb-node-key" cx="534" cy="524" r="6"/>
    <circle class="pb-node-key" cx="642" cy="512" r="6"/>
    <circle class="pb-node-key" cx="758" cy="472" r="6"/>
    <circle class="pb-node-key" cx="880" cy="528" r="6"/>
  </g>
</svg>
